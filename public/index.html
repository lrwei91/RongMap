<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>福州地图标记</title>
  <link rel="stylesheet" href="style.css">
  <script type="text/javascript">
    window._AMapSecurityConfig = {
      securityJsCode: 'db67e6113b81508f33ae7b14dbc42358'
    };
  </script>
  <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=806754933c281cf11a95842b5f9cef59"></script>
</head>
<body>
  <div class="app-shell">
    <header class="panel-header">
      <div>
        <p class="eyebrow">FUZHOU LOCATION BOARD</p>
        <h1>福州地点管理台</h1>
        <p class="subtitle">录入地点、自动地理编码、在地图中快速定位。</p>
      </div>
      <div class="stats" aria-label="地点统计信息">
        <div class="stat-card">
          <span class="stat-label">总地点</span>
          <strong id="locationCount">0</strong>
        </div>
        <div class="stat-card">
          <span class="stat-label">已定位</span>
          <strong id="geocodedCount">0</strong>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="locateMeBtn" class="btn btn-primary locate-me-btn" title="获取我的当前位置">
          定位我
        </button>
        <button type="button" id="exportBtn" class="btn btn-ghost" title="导出所有地点数据">
          导出数据
        </button>
      </div>
    </header>

    <div class="workspace">
      <aside class="control-panel" aria-label="地点输入与管理面板">
        <section class="card input-section">
          <h2>添加地点</h2>
          <label for="singleInput">单条地址</label>
          <div class="search-box">
            <input type="text" id="singleInput" placeholder="例如：群哥水煮蛙 仓山万达店" autocomplete="off">
            <div id="searchSuggestions" class="search-suggestions"></div>
          </div>
          <label for="categorySelect">分类</label>
          <select id="categorySelect" class="category-select">
            <option value="">选择分类（可选）</option>
            <option value="food">🍽️ 餐饮美食</option>
            <option value="spot">🏞️ 景点休闲</option>
            <option value="shopping">🛍️ 购物消费</option>
            <option value="traffic">🚇 交通枢纽</option>
            <option value="medical">🏥 医疗服务</option>
            <option value="education">📚 教育培训</option>
            <option value="other">📍 其他</option>
          </select>
          <label for="reasonInput">添加理由（可选）</label>
          <input type="text" id="reasonInput" placeholder="例如：朋友推荐、想吃蛙">
          <button type="button" id="addSingleBtn" class="btn btn-primary">添加并定位</button>

          <div class="divider" role="separator" aria-label="分隔线">
            <span>或批量导入</span>
          </div>

          <label for="batchInput">批量地址（每行一个）</label>
          <textarea id="batchInput" rows="6" placeholder="群哥水煮蛙 仓山万达店&#10;福州西湖公园&#10;三坊七巷"></textarea>
          <button type="button" id="addBatchBtn" class="btn btn-secondary">批量添加并定位</button>
        </section>

        <section class="card locations-section">
          <div class="section-head">
            <h2>地点列表</h2>
            <div class="section-actions">
              <select id="filterCategory" class="filter-select">
                <option value="">全部分类</option>
                <option value="food">🍽️ 餐饮美食</option>
                <option value="spot">🏞️ 景点休闲</option>
                <option value="shopping">🛍️ 购物消费</option>
                <option value="traffic">🚇 交通枢纽</option>
                <option value="medical">🏥 医疗服务</option>
                <option value="education">📚 教育培训</option>
                <option value="other">📍 其他</option>
              </select>
              <input type="text" id="searchInput" class="search-locations-input" placeholder="搜索地点..." />
              <button type="button" id="fitMarkersBtn" class="btn btn-ghost">定位全部</button>
              <button type="button" id="bulkDeleteBtn" class="btn btn-ghost bulk-delete-btn" style="display: none;">
                删除选中 (<span id="selectedCount">0</span>)
              </button>
            </div>
          </div>
          <div id="locationsList" class="locations-list" aria-live="polite"></div>
        </section>
      </aside>

      <main class="map-panel" aria-label="地图展示区">
        <div class="map-head">
          <p>点击列表中的地点可在地图中聚焦，点击标记可查看详细地址。</p>
        </div>
        <div id="map"></div>
      </main>
    </div>

    <!-- 编辑对话框 -->
    <div id="editDialog" class="dialog-overlay" style="display: none;">
      <div class="dialog">
        <div class="dialog-header">
          <h3>编辑地点</h3>
          <button type="button" class="dialog-close" aria-label="关闭">&times;</button>
        </div>
        <div class="dialog-body">
          <input type="hidden" id="editLocationId">
          <label for="editName">名称</label>
          <input type="text" id="editName">
          <label for="editAddress">地址</label>
          <input type="text" id="editAddress">
          <label for="editCategory">分类</label>
          <select id="editCategory" class="category-select">
            <option value="">无分类</option>
            <option value="food">🍽️ 餐饮美食</option>
            <option value="spot">🏞️ 景点休闲</option>
            <option value="shopping">🛍️ 购物消费</option>
            <option value="traffic">🚇 交通枢纽</option>
            <option value="medical">🏥 医疗服务</option>
            <option value="education">📚 教育培训</option>
            <option value="other">📍 其他</option>
          </select>
          <label for="editReason">理由</label>
          <input type="text" id="editReason">
        </div>
        <div class="dialog-footer">
          <button type="button" id="cancelEditBtn" class="btn btn-ghost">取消</button>
          <button type="button" id="saveEditBtn" class="btn btn-primary">保存修改</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
