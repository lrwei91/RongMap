<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <meta name="description" content="收藏福州想去的地方，在地图上回看、整理和分享。">
  <title>RongMap · 福州地点地图</title>
  <link rel="preconnect" href="https://webapi.amap.com">
  <link rel="stylesheet" href="style.css">
  <script type="text/javascript">
    window._AMapSecurityConfig = {
      securityJsCode: 'db67e6113b81508f33ae7b14dbc42358'
    };
  </script>
  <script type="text/javascript" src="https://webapi.amap.com/maps?v=2.0&key=806754933c281cf11a95842b5f9cef59" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="panel-header">
      <div class="header-copy">
        <p class="eyebrow">RONGMAP · 福州地点</p>
        <h1>福州地点地图</h1>
        <p class="subtitle">收藏想去的地方，随时在地图上回看。</p>
      </div>
      <div class="stats" aria-label="地点统计信息">
        <div class="stat-card">
          <span class="stat-label">收藏</span>
          <strong id="locationCount">0</strong>
        </div>
        <div class="stat-card">
          <span class="stat-label">已定位</span>
          <strong id="geocodedCount">0</strong>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" id="locateMeBtn" class="btn btn-primary locate-me-btn" title="获取我的当前位置">
          定位我
        </button>
        <div class="export-group" role="group" aria-label="导出地点数据">
          <button type="button" id="exportJsonBtn" class="btn btn-ghost" title="导出 JSON 格式">
            导出 JSON
          </button>
          <button type="button" id="exportCsvBtn" class="btn btn-ghost" title="导出 CSV 格式">
            导出 CSV
          </button>
        </div>
      </div>
    </header>

    <div class="workspace">
      <aside class="control-panel" aria-label="地点输入与管理面板">
        <div id="mobileAddSheet" class="mobile-sheet-shell" aria-hidden="false">
          <div class="mobile-sheet-backdrop" data-mobile-sheet-close="add"></div>
          <section class="card input-section mobile-sheet-card">
            <div class="mobile-sheet-bar mobile-only">
              <div class="mobile-sheet-grabber" aria-hidden="true"></div>
              <button type="button" id="mobileAddCloseBtn" class="sheet-close" aria-label="关闭">&times;</button>
            </div>
            <div class="section-intro">
              <p class="section-kicker">加入地点</p>
              <h2>把想去的地方搜进来</h2>
            </div>
            <label for="singleInput">地点</label>
            <div class="search-box">
              <input type="text" id="singleInput" placeholder="例如：群哥水煮蛙 仓山万达店" autocomplete="off" maxlength="120">
              <div id="searchSuggestions" class="search-suggestions"></div>
            </div>
            <label for="categorySelect">分类</label>
            <select id="categorySelect" class="category-select">
              <option value="food" selected>餐饮美食</option>
              <option value="spot">景点休闲</option>
              <option value="cafe_bar">日咖夜酒</option>
            </select>
            <label for="reasonInput">备注</label>
            <input type="text" id="reasonInput" placeholder="例如：朋友推荐、想吃蛙" maxlength="240">
            <button type="button" id="addSingleBtn" class="btn btn-primary">加入地图</button>
          </section>
        </div>

        <div id="mobileListSheet" class="mobile-sheet-shell" aria-hidden="false">
          <div class="mobile-sheet-backdrop" data-mobile-sheet-close="list"></div>
          <section class="card locations-section mobile-sheet-card">
            <div class="mobile-sheet-bar mobile-only">
              <div class="mobile-sheet-grabber" aria-hidden="true"></div>
              <button type="button" id="mobileListCloseBtn" class="sheet-close" aria-label="关闭">&times;</button>
            </div>
            <div class="section-head">
              <div>
                <p class="section-kicker">收藏列表</p>
                <h2>已收藏地点</h2>
                <p id="listSummary" class="section-meta">暂无收藏</p>
              </div>
              <div class="mobile-list-toolbar mobile-only">
                <button type="button" id="mobileExportJsonBtn" class="btn btn-ghost" title="导出 JSON 格式">
                  JSON
                </button>
                <button type="button" id="mobileExportCsvBtn" class="btn btn-ghost" title="导出 CSV 格式">
                  CSV
                </button>
              </div>
            </div>
            <div class="list-filters" aria-label="地点检索与过滤">
              <input type="search" id="locationSearchInput" class="list-search-input" placeholder="搜索已收藏的地点">
            </div>
            <div id="locationsList" class="locations-list" aria-live="polite"></div>
          </section>
        </div>
      </aside>

      <main class="map-panel" aria-label="地图展示区">
        <div class="map-head">
          <div class="map-head-top">
            <p class="map-note">点列表中的卡片查看详情，地图会自动定位。</p>
            <label class="map-filter" for="categoryFilterSelect">
              <select id="categoryFilterSelect" class="map-filter-select" aria-label="按分类筛选地点"></select>
            </label>
          </div>
          <div class="map-meta">
            <span id="viewportCount" class="map-chip">视野内 0</span>
            <p id="viewportHint" class="map-hint">拖动地图查看该范围内的地点。</p>
          </div>
        </div>
        <div class="map-stage">
          <div id="map" aria-label="福州地点地图"></div>
          <div id="mapStatus" class="map-status" role="status" aria-live="polite">
            <div class="map-status-card">
              <span class="map-status-mark" aria-hidden="true">⌖</span>
              <p id="mapStatusTitle" class="map-status-title">地图加载中</p>
              <p id="mapStatusMessage" class="map-status-message">正在连接高德地图，收藏列表仍可正常使用。</p>
              <button type="button" id="mapRetryBtn" class="btn btn-primary" hidden>重新加载地图</button>
            </div>
          </div>
          <div id="mobileZoomControls" class="mobile-zoom-controls mobile-only" aria-label="地图缩放">
            <button type="button" id="mobileZoomInBtn" class="mobile-zoom-btn" aria-label="放大地图">
              <span aria-hidden="true">＋</span>
            </button>
            <button type="button" id="mobileZoomOutBtn" class="mobile-zoom-btn" aria-label="缩小地图">
              <span aria-hidden="true">－</span>
            </button>
          </div>
        </div>
        <div id="mobileMapOverlay" class="mobile-map-overlay mobile-only" aria-live="polite">
          <div class="mobile-filter-bar">
            <label class="map-filter map-filter-mobile" for="mobileCategoryFilterSelect">
              <select id="mobileCategoryFilterSelect" class="map-filter-select" aria-label="按分类筛选地点"></select>
            </label>
          </div>
          <div class="mobile-chip-row">
            <span id="mobileLocationSummary" class="map-chip">暂无收藏</span>
            <span id="mobileViewportCount" class="map-chip">视野内 0</span>
          </div>
          <p id="mobileViewportHint" class="mobile-overlay-hint">拖动地图查看该范围内的地点。</p>
        </div>
      </main>
    </div>

    <div id="mobileActionDock" class="mobile-action-dock mobile-only" aria-label="移动端快捷操作">
      <button type="button" id="mobileLocateBtn" class="mobile-dock-btn" title="定位我的位置">定位我</button>
      <button type="button" id="mobileAddToggleBtn" class="mobile-dock-primary" aria-label="加入地点" aria-expanded="false">+</button>
      <button type="button" id="mobileListToggleBtn" class="mobile-dock-btn" aria-label="查看收藏列表" aria-expanded="false">收藏</button>
    </div>

    <div id="detailDrawer" class="drawer-shell" aria-hidden="true">
      <div class="drawer-backdrop" data-drawer-close="true"></div>
      <aside class="detail-drawer" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
        <div class="drawer-handle" aria-hidden="true"></div>
        <div class="drawer-header">
          <div class="drawer-heading">
            <p class="section-kicker">详情</p>
            <h3 id="detailTitle">地点</h3>
          </div>
          <button type="button" id="detailCloseBtn" class="dialog-close" aria-label="关闭">&times;</button>
        </div>
        <div class="drawer-badges">
          <span id="detailCategory" class="category-badge detail-category" hidden></span>
        </div>
        <div class="drawer-body">
          <section class="detail-section">
            <span class="detail-label">地址</span>
            <p id="detailAddress" class="detail-text">暂无地址</p>
          </section>
          <section class="detail-section">
            <span class="detail-label">备注</span>
            <p id="detailReason" class="detail-note detail-note-empty">暂无备注</p>
          </section>
          <div class="detail-grid">
            <section class="detail-section detail-cell">
              <span class="detail-label">坐标</span>
              <p id="detailCoords" class="detail-text">未定位</p>
            </section>
            <section class="detail-section detail-cell">
              <span class="detail-label">添加时间</span>
              <p id="detailCreatedAt" class="detail-text">未知</p>
            </section>
          </div>
        </div>
        <div class="drawer-actions">
          <button type="button" id="detailFocusBtn" class="btn btn-primary">聚焦</button>
          <button type="button" id="detailNavigateBtn" class="btn btn-ghost">去这里</button>
          <button type="button" id="detailShareBtn" class="btn btn-ghost">分享</button>
          <button type="button" id="detailEditBtn" class="btn btn-ghost">编辑</button>
          <button type="button" id="detailDeleteBtn" class="btn btn-ghost btn-danger-ghost">删除</button>
        </div>
      </aside>
    </div>

    <div id="sharePosterDialog" class="share-poster-overlay" aria-hidden="true">
      <div class="share-poster-backdrop" data-share-poster-close="true"></div>
      <section class="share-poster-dialog" role="dialog" aria-modal="true" aria-labelledby="sharePosterTitle">
        <div class="dialog-header">
          <div>
            <p class="section-kicker">分享海报</p>
            <h3 id="sharePosterTitle">右键或长按图片保存</h3>
          </div>
          <button type="button" id="sharePosterCloseBtn" class="dialog-close" aria-label="关闭">&times;</button>
        </div>
        <div class="share-poster-preview-shell">
          <img id="sharePosterPreview" class="share-poster-preview" alt="地点分享海报">
        </div>
        <div class="share-poster-actions">
          <button type="button" id="sharePosterCopyBtn" class="btn btn-ghost">复制链接</button>
          <button type="button" id="sharePosterDoneBtn" class="btn btn-primary">完成</button>
        </div>
      </section>
    </div>

    <!-- 编辑对话框 -->
    <div id="editDialog" class="dialog-overlay" aria-hidden="true">
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="editDialogTitle">
        <div class="dialog-header">
          <h3 id="editDialogTitle">编辑</h3>
          <button type="button" id="editDialogCloseBtn" class="dialog-close" aria-label="关闭">&times;</button>
        </div>
        <div class="dialog-body">
          <input type="hidden" id="editLocationId">
          <label for="editName">名称</label>
          <input type="text" id="editName" maxlength="120">
          <label for="editAddress">地址</label>
          <input type="text" id="editAddress" maxlength="240">
          <label for="editCategory">分类</label>
          <select id="editCategory" class="category-select">
            <option value="food">餐饮美食</option>
            <option value="spot">景点休闲</option>
            <option value="cafe_bar">日咖夜酒</option>
          </select>
          <label for="editReason">备注</label>
          <input type="text" id="editReason" maxlength="240">
        </div>
        <div class="dialog-footer">
          <button type="button" id="cancelEditBtn" class="btn btn-ghost">取消</button>
          <button type="button" id="saveEditBtn" class="btn btn-primary">保存</button>
        </div>
      </div>
    </div>

    <!-- 删除确认对话框 -->
    <div id="confirmDialog" class="dialog-overlay" aria-hidden="true">
      <div class="dialog dialog-confirm" role="alertdialog" aria-modal="true" aria-labelledby="confirmDialogTitle" aria-describedby="confirmDialogMessage">
        <div class="dialog-header">
          <h3 id="confirmDialogTitle">请确认</h3>
        </div>
        <div class="dialog-body">
          <p id="confirmDialogMessage" class="confirm-message">确认此操作？</p>
        </div>
        <div class="dialog-footer">
          <button type="button" id="confirmDialogCancelBtn" class="btn btn-ghost">取消</button>
          <button type="button" id="confirmDialogOkBtn" class="btn btn-primary btn-danger">确认</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
